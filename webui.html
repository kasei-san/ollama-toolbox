<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ollama-toolbox</title>
<style>
  /* 配色はブラウザ/OS のテーマに追従する。明示的なトグルは付けていない。 */
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --dim: #6b6b6b; --line: #e0e0e0;
    --panel: #f7f7f7; --user: #eef3fb; --accent: #2b6cb0; --warn: #b0402b;
    --code: #f0f0f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17191c; --fg: #e6e6e6; --dim: #9aa0a6; --line: #2e3238;
      --panel: #1e2126; --user: #22303f; --accent: #7ab3ea; --warn: #e08a72;
      --code: #23262b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--fg);
    font: 15px/1.7 "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  }
  button, select, textarea, input { font: inherit; color: inherit; }
  button {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 10px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.on { border-color: var(--accent); color: var(--accent); }
  /* 幅は一番長いモデル名（hf.co/... の長いタグ）に引っ張られるので頭を押さえる */
  select {
    max-width: 240px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 6px;
  }

  /* --- 左: 会話ログの一覧 --- */
  #side {
    width: 240px; flex: none; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; background: var(--panel);
  }
  #side header { padding: 10px; border-bottom: 1px solid var(--line); }
  #chats { overflow-y: auto; flex: 1; }
  .chat {
    padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer;
    display: flex; gap: 6px; align-items: baseline;
  }
  .chat:hover { background: var(--bg); }
  .chat.sel { border-left: 3px solid var(--accent); padding-left: 7px; }
  .chat .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat .d { font-size: 11px; color: var(--dim); flex: none; }
  .chat .x { visibility: hidden; color: var(--dim); }
  .chat:hover .x { visibility: visible; }

  /* --- 右: 本体 --- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #bar {
    padding: 8px 12px; border-bottom: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    font-size: 13px;
  }
  #bar .sp { flex: 1; }
  #bar .meta { color: var(--dim); }

  /* VRAM インジケーター。2本重ねてある:
       下(--used)  GPU 全体の使用量
       上(--model) そのうち今のモデルが載せている分
     「空きが無い」のか「このモデルが食っている」のかを一目で分けるため。 */
  #vram { display: flex; align-items: center; gap: 7px; color: var(--dim); }
  #vram .gauge {
    width: 110px; height: 10px; border-radius: 5px; background: var(--line);
    position: relative; overflow: hidden; flex: none;
  }
  #vram .gauge i { position: absolute; top: 0; bottom: 0; left: 0; }
  #vram .gauge .used  { background: var(--dim); opacity: .55; }
  #vram .gauge .model { background: var(--accent); }
  #vram.tight .gauge .used { background: var(--warn); opacity: .75; }
  #vram .num { font-variant-numeric: tabular-nums; }
  #vram .off { color: var(--warn); }
  #sysbox { border-bottom: 1px solid var(--line); padding: 10px 12px; display: none; }
  #sysbox textarea { width: 100%; min-height: 90px; resize: vertical;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px; }
  #sysbox .note { color: var(--dim); font-size: 12px; margin: 6px 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  #log > * { max-width: 860px; margin: 0 auto 14px; }
  .msg { white-space: pre-wrap; word-break: break-word; }
  .msg.user {
    background: var(--user); border-radius: 8px; padding: 10px 12px;
  }
  .msg.error { color: var(--warn); }
  .who { font-size: 12px; color: var(--dim); margin-bottom: 2px; }
  details.aux {
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
    font-size: 13px; background: var(--panel);
  }
  details.aux summary { cursor: pointer; color: var(--dim); }
  details.aux pre {
    white-space: pre-wrap; word-break: break-word; margin: 8px 0 0;
    color: var(--dim); font: 12px/1.6 ui-monospace, Consolas, monospace;
  }
  .note { color: var(--dim); font-size: 12px; }

  /* --- 動いていることを見せる ---
     最初のトークンが来るまで、冷えたモデルだと50秒ほど何も出ない。
     そこが一番「固まったのか考えているのか」分からないので、
     何をしているかと経過秒をログ側に出す。 */
  .working {
    display: flex; align-items: center; gap: 10px;
    color: var(--dim); font-size: 13px;
  }
  .working .dots { display: inline-flex; gap: 4px; flex: none; }
  .working .dots i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .working .dots i:nth-child(2) { animation-delay: .15s; }
  .working .dots i:nth-child(3) { animation-delay: .30s; }
  @keyframes bounce {
    0%, 60%, 100% { opacity: .25; transform: translateY(0); }
    30%           { opacity: 1;   transform: translateY(-4px); }
  }
  .working .what { flex: 1; overflow: hidden; text-overflow: ellipsis;
                   white-space: nowrap; }
  .working .secs { font-variant-numeric: tabular-nums; flex: none; }

  /* 出力中のブロックの末尾で点滅させる。文字が途切れたのか、まだ来るのかの区別 */
  .streaming::after {
    content: "▍"; color: var(--accent); animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* 動きが苦手な設定なら止める。情報は文字側に出ているので消えて困らない */
  @media (prefers-reduced-motion: reduce) {
    .working .dots i, .streaming::after { animation: none; }
    .working .dots i { opacity: .8; }
  }
  .hits { margin: 6px 0 0; padding-left: 18px; }
  .hits li { margin-bottom: 4px; }
  .hits a { color: var(--accent); }
  #form { border-top: 1px solid var(--line); padding: 10px 12px; }
  #form .row { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; }
  #q {
    flex: 1; min-height: 48px; max-height: 200px; resize: vertical; padding: 8px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  #hint { max-width: 860px; margin: 6px auto 0; color: var(--dim); font-size: 12px; }
  .empty { color: var(--dim); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div id="side">
  <header><button id="new">＋ 新しい会話</button></header>
  <div id="chats"></div>
</div>

<div id="main">
  <div id="bar">
    <select id="model" title="このターンから使うモデル"></select>
    <button id="think" class="on" title="思考の on / off">think</button>
    <button id="force" title="毎回かならず検索する">force</button>
    <button id="sysbtn">system</button>
    <span class="sp"></span>
    <span id="vram" title="VRAM"></span>
    <span class="meta" id="meta"></span>
  </div>

  <div id="sysbox">
    <textarea id="sys" placeholder="空にすると Modelfile に焼かれた SYSTEM が効く"></textarea>
    <div class="note">
      <strong>Modelfile の SYSTEM を置き換える</strong>（重ねるのではない）。
      「クエリに年を足すな」という日付まわりの禁止も消えるので、要るなら書き足すこと。
      空にすれば元に戻る。
    </div>
    <button id="syssave">保存</button>
  </div>

  <div id="log"></div>

  <div id="form">
    <div class="row">
      <textarea id="q" placeholder="聞きたいことを書く（Shift+Enter で送信 / Enter で改行）"></textarea>
      <button id="send">送信</button>
    </div>
    <div id="hint"></div>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;   // 常に textContent。HTML は入れない
  return n;
};

let state = { chatId: null, chats: [], think: true, force: false, busy: false };

async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

// --- 一覧 ----------------------------------------------------------------
async function loadChats() {
  state.chats = await api("GET", "/api/chats");
  const box = $("#chats");
  box.textContent = "";
  for (const c of state.chats) {
    const row = el("div", "chat" + (c.id === state.chatId ? " sel" : ""));
    row.append(el("span", "t", c.title || "(無題)"),
               el("span", "d", (c.updated_at || "").slice(5, 16)));
    const x = el("span", "x", "✕");
    x.title = "この会話を消す";
    x.onclick = async ev => {
      ev.stopPropagation();
      if (!confirm("この会話を消す？ 元に戻せない。")) return;
      await api("DELETE", "/api/chats/" + c.id);
      if (state.chatId === c.id) { state.chatId = null; $("#log").textContent = ""; }
      loadChats();
    };
    row.append(x);
    row.onclick = () => openChat(c.id);
    box.append(row);
  }
}

async function newChat() {
  const { id } = await api("POST", "/api/chats");
  await loadChats();
  openChat(id);
}

// --- 1つの会話 -----------------------------------------------------------
async function openChat(id) {
  state.chatId = id;
  const chat = await api("GET", "/api/chats/" + id);
  $("#sys").value = chat.system || "";
  if (chat.model) $("#model").value = chat.model;
  const log = $("#log");
  log.textContent = "";
  for (const m of chat.messages) renderStored(m);
  if (!chat.messages.length) log.append(el("div", "empty", "まだ何も聞いていない"));
  log.scrollTop = log.scrollHeight;
  loadChats();
}

function renderStored(m) {
  const log = $("#log");
  if (m.role === "user") {
    const b = el("div", "msg user", m.content);
    log.append(b);
    return;
  }
  if (m.role === "error") { log.append(el("div", "msg error", m.content)); return; }
  if (m.role === "tool") {
    log.append(auxBlock("検索結果 (" + (m.tool_name || "tool") + ")", m.content));
    return;
  }
  // assistant
  if (m.tool_calls) {
    for (const c of JSON.parse(m.tool_calls)) {
      log.append(el("div", "note",
        "→ " + c.function.name + " " + JSON.stringify(c.function.arguments)));
    }
  }
  if (m.thinking) log.append(auxBlock("思考", m.thinking));
  if (m.content) {
    const wrap = el("div");
    wrap.append(el("div", "who", "assistant"), el("div", "msg", m.content));
    log.append(wrap);
  }
}

function auxBlock(label, text) {
  const d = el("details", "aux");
  d.append(el("summary", null, label));
  d.append(el("pre", null, text));
  return d;
}

// --- 動いていることを見せる ----------------------------------------------
function workingRow(log) {
  // 経過秒も出す。「何をしているか」だけだと、進んでいるのか止まったのか
  // 分からない。冷えたモデルの最初の1問は50秒ほどかかる。
  const row = el("div", "working");
  const what = el("span", "what", "モデルの応答を待っている");
  const secs = el("span", "secs", "0秒");
  row.append(el("span", "dots"), what, secs);
  row.querySelector(".dots").append(el("i"), el("i"), el("i"));
  log.append(row);
  const t0 = Date.now();
  const timer = setInterval(() => {
    secs.textContent = Math.round((Date.now() - t0) / 1000) + "秒";
  }, 500);
  return {
    row,                          // 新しい行はこの手前に挿す（常に最下段に残す）
    phase: text => { what.textContent = text; },
    stop: () => { clearInterval(timer); row.remove(); },
  };
}

// --- 送信 ----------------------------------------------------------------
async function send() {
  const q = $("#q").value.trim();
  if (!q || state.busy) return;
  if (!state.chatId) await newChat();
  const log = $("#log");
  log.querySelector(".empty")?.remove();
  log.append(el("div", "msg user", q));
  $("#q").value = "";
  state.busy = true;
  $("#send").disabled = true;
  $("#hint").textContent = "";

  // 進捗の入れ物。届いた端から差し替える。
  let think = null, answerBox = null, answerText = "";
  // 動いていることを見せる行。**ログの一番下に置く**ので、何をしているかが
  // 会話の流れの中で見える（下の入力欄まで目を動かさなくていい）。
  const work = workingRow(log);
  log.scrollTop = log.scrollHeight;

  // 出力中のブロックは末尾に点滅を出す。動くのは1箇所だけにする。
  const streamOn = node => {
    log.querySelectorAll(".streaming").forEach(n => n.classList.remove("streaming"));
    node?.classList.add("streaming");
  };

  try {
    const r = await fetch("/api/chats/" + state.chatId + "/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, force: state.force, think: state.think,
                             model: $("#model").value }),
    });
    if (!r.ok || !r.body) {
      const e = await r.json().catch(() => ({}));
      log.append(el("div", "msg error", e.error || ("HTTP " + r.status)));
      return finish();
    }

    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      // SSE は空行区切り。届く単位はイベント境界と一致しないので自分で切る。
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).replace(/^data: /, "");
        buf = buf.slice(i + 2);
        if (!line) continue;
        const { kind, payload } = JSON.parse(line);
        if (kind === "think") {
          if (!think) {
            think = auxBlock("思考", ""); think.open = true;
            log.insertBefore(think, work.row);
          }
          think.querySelector("pre").textContent += payload;
          work.phase("考えている");
          streamOn(think.querySelector("pre"));
        } else if (kind === "content") {
          if (!answerBox) {
            const wrap = el("div");
            answerBox = el("div", "msg");
            wrap.append(el("div", "who", "assistant"), answerBox);
            log.insertBefore(wrap, work.row);
          }
          answerText += payload;
          answerBox.textContent = answerText;
          work.phase("答えを書いている");
          streamOn(answerBox);
        } else if (kind === "tool") {
          if (think) think.open = false;
          streamOn(null);
          const arg = payload.args.query || payload.args.url || "";
          work.phase(`${payload.name}: ${arg}`);
          log.insertBefore(el("div", "note",
            "→ " + payload.name + " " + JSON.stringify(payload.args)), work.row);
        } else if (kind === "result") {
          work.phase("結果を読んでいる");
          log.insertBefore(hitsBlock(payload.result), work.row);
        } else if (kind === "note") {
          log.insertBefore(el("div", "note", "· " + payload), work.row);
        } else if (kind === "error") {
          // サーバ側で既に「何に失敗したか」を書いてある。ここで decorate しない
          // ——「検索に失敗した」と一律に被せると、VRAM 不足まで検索のせいに見える。
          log.insertBefore(el("div", "msg error", payload), work.row);
        } else if (kind === "done") {
          if (think) think.open = false;
          // ストリームの取りこぼしがあっても最終的な答えに揃える
          if (answerBox) answerBox.textContent = payload.answer;
          loadChats();
        }
        log.scrollTop = log.scrollHeight;
      }
    }
  } catch (e) {
    log.append(el("div", "msg error", "通信が切れた: " + e.message));
  }
  finish();

  function finish() {
    // **必ず通る。** ここを飛ばすと点滅と経過秒が回りっぱなしになる。
    work.stop();
    streamOn(null);
    state.busy = false;
    $("#send").disabled = false;
    $("#hint").textContent = "";
    $("#q").focus();
  }
}

// --- VRAM インジケーター --------------------------------------------------
const gb = mb => (mb / 1024).toFixed(1);

async function refreshVram() {
  // タブが見えていないときは測りに行かない。nvidia-smi は毎回プロセスが起きる。
  if (document.hidden) return;
  try { renderVram(await api("GET", "/api/vram")); } catch (e) { /* 落ちても黙る */ }
}

async function pollVram() {
  await refreshVram();
  // 生成中は VRAM が動くので短く、待っている間は長く。
  setTimeout(pollVram, state.busy ? 2000 : 6000);
}

function renderVram(v) {
  const box = $("#vram");
  box.textContent = "";
  if (!v.gpu) {                       // nvidia-smi が無い環境。数字だけ諦める
    box.append(el("span", "num", "VRAM 不明"));
    return;
  }
  const { total_mb, used_mb } = v.gpu;
  // 上部で選んでいるモデルではなく、**いま実際に載っているもの**を見る。
  const mine = v.loaded.find(m => m.name === $("#model").value);
  const g = el("div", "gauge");
  const used = el("i", "used"), model = el("i", "model");
  used.style.width = Math.min(100, used_mb / total_mb * 100) + "%";
  model.style.width = (mine ? Math.min(100, mine.vram_mb / total_mb * 100) : 0) + "%";
  g.append(used, model);

  const free = total_mb - used_mb;
  box.classList.toggle("tight", free < 2048);   // 2GB を切ったら赤
  box.append(el("span", null, "VRAM"), g,
             el("span", "num", `${gb(used_mb)}/${gb(total_mb)}GB`));
  if (mine) {
    box.append(el("span", "num", `· ${gb(mine.vram_mb)}GB`));
    box.title = `${mine.name}: VRAM ${gb(mine.vram_mb)}GB` +
                (mine.context_length ? ` / num_ctx ${mine.context_length}` : "") +
                `\nGPU 全体 ${gb(used_mb)} / ${gb(total_mb)}GB（空き ${gb(free)}GB）`;
    // size と size_vram の差が CPU に溢れた分。0 でなければ 100% GPU ではない。
    const cpu = mine.size_mb - mine.vram_mb;
    if (cpu > 0) box.append(el("span", "off", `(CPU に ${gb(cpu)}GB)`));
    // Ollama の申告がカードの容量を超えることがある（実際に出た: 17.4 > 15.9）。
    // Windows のドライバは溢れた分を共有システムメモリに逃がすので、
    // **載ってはいるが物理 VRAM には収まっていない**。数字が矛盾して見えるので明示する。
    if (mine.vram_mb > total_mb) {
      box.classList.add("tight");
      box.append(el("span", "off", "(カードの容量超過)"));
      box.title += `\n\nOllama の申告 ${gb(mine.vram_mb)}GB が物理 VRAM ` +
                   `${gb(total_mb)}GB を超えている。溢れた分は共有システムメモリ` +
                   `（RAM）に逃げているので、動いても遅くなりうる。`;
    }
  } else {
    box.append(el("span", "num", "· 未ロード"));
    box.title = `${$("#model").value} はまだ載っていない\n` +
                `GPU 全体 ${gb(used_mb)} / ${gb(total_mb)}GB（空き ${gb(free)}GB）`;
  }
}

function hitsBlock(res) {
  // web_search は results[]、web_fetch は text。それ以外は生で見せる。
  if (res && Array.isArray(res.results)) {
    const d = el("details", "aux");
    d.append(el("summary", null, "検索結果 " + res.results.length + "件: " + (res.query || "")));
    const ul = el("ul", "hits");
    for (const h of res.results) {
      const li = el("li");
      const a = el("a", null, h.title || h.url);
      a.href = h.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      li.append(a, el("div", "note", h.content || ""));
      ul.append(li);
    }
    d.append(ul);
    return d;
  }
  if (res && res.text !== undefined) {
    return auxBlock("取得: " + (res.url || ""), res.text);
  }
  return auxBlock("結果", JSON.stringify(res, null, 2));
}

// --- 立ち上げ ------------------------------------------------------------
(async function init() {
  const s = await api("GET", "/api/state");
  $("#meta").textContent =
    `backend=${s.backend}  safesearch=${s.safesearch}  num_ctx=${s.num_ctx}`;
  const sel = $("#model");
  for (const m of s.models) sel.append(new Option(m, m));
  sel.value = s.model;

  $("#new").onclick = newChat;
  $("#send").onclick = send;
  $("#think").onclick = e => { state.think = !state.think; e.target.classList.toggle("on", state.think); };
  $("#force").onclick = e => { state.force = !state.force; e.target.classList.toggle("on", state.force); };
  $("#sysbtn").onclick = () => {
    const b = $("#sysbox");
    b.style.display = b.style.display === "block" ? "none" : "block";
  };
  $("#syssave").onclick = async () => {
    if (!state.chatId) await newChat();
    await api("PATCH", "/api/chats/" + state.chatId, { system: $("#sys").value });
    $("#sysbox").style.display = "none";
  };
  $("#q").addEventListener("keydown", e => {
    // **Shift+Enter で送信、Enter は改行。** Enter を送信にすると、
    // 長い質問を書いている途中の改行が誤送信になる。
    // `isComposing` を見るのは、IME の変換確定の Enter を拾わないため。
    if (e.key === "Enter" && e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  // モデルを変えたら、そのモデルの載り具合をすぐ見たい
  sel.onchange = refreshVram;
  // 裏にいる間は測らないので、表に戻った瞬間の表示は古い。すぐ測り直す。
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) refreshVram();
  });

  await loadChats();
  if (state.chats.length) openChat(state.chats[0].id);
  pollVram();
  $("#q").focus();
})();
</script>
</body>
</html>
