# ローカルLLM 用の SearXNG 設定。
# リポジトリ本体（searx/settings.yml）は触らず、これを SEARXNG_SETTINGS_PATH で指す。
# 既定値を継承して差分だけ書く。
use_default_settings: true

general:
  instance_name: "local"
  # 検索以外の機能を切って軽くする
  enable_metrics: false

server:
  bind_address: "127.0.0.1"
  port: 8888
  # 127.0.0.1 に bind した個人用インスタンス前提の固定値。
  # **LAN や外に出すなら必ず作り直すこと。** この値は公開リポジトリに載っているので、
  # そのまま使うと「誰でも知っている鍵」になる。
  #   python -c "import secrets; print(secrets.token_hex(32))"
  secret_key: "CHANGE-ME-local-only-not-a-shared-instance"
  limiter: false
  public_instance: false
  image_proxy: false

search:
  # ← これが本題。既定は html のみで JSON が返らない
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""

ui:
  static_use_hash: true

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 20
  pool_maxsize: 10
